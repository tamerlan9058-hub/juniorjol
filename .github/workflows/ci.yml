name: Тесты

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Тесты
        run: python3 -m unittest discover -s tests -v
      - name: README и данные синхронизированы
        run: python3 scripts/board.py render --check
